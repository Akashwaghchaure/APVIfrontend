<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Dynamic Energy / Wind / Power Turbine Mark -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield / Turbine Ring Subtle Accent -->
    <circle cx="26" cy="26" r="24" stroke="#244B80" stroke-width="2" stroke-opacity="0.3" fill="none" />
    
    <!-- Power Blade 1 (Primary Navy) -->
    <path d="M26 6 C26 6 36 14 36 26 C30 24 28 20 26 6 Z" fill="#0B1730" />
    
    <!-- Power Blade 2 (Steel Blue) -->
    <path d="M46 26 C46 26 38 36 26 36 C28 30 32 28 46 26 Z" fill="#244B80" />
    
    <!-- Power Blade 3 (Energy Cyan Accent) -->
    <path d="M26 46 C26 46 16 38 16 26 C22 28 24 32 26 46 Z" fill="#0284C7" />
    
    <!-- Power Blade 4 (Sky Blue) -->
    <path d="M6 26 C6 26 14 16 26 16 C24 22 20 24 6 26 Z" fill="#38BDF8" />
    
    <!-- Center Core Node -->
    <circle cx="26" cy="26" r="5" fill="#0B1730" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="26" cy="26" r="2" fill="#0284C7" />
  </g>

  <!-- Typography: AIR POWERVISION -->
  <text x="68" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0B1730" letter-spacing="1.5">
    AIR <tspan fill="#244B80">POWERVISION</tspan>
  </text>
  
  <!-- Sub-label: INDIA / ENERGY & POWER SOLUTIONS -->
  <text x="69" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0284C7" letter-spacing="3.5">
    INDIA
  </text>
  <text x="116" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" letter-spacing="1.2">
    | ENERGY &amp; POWER SOLUTIONS
  </text>
</svg>
